<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paletas de cores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Paleta De Cores</h1>
    <div id="tela-de-pintura"></div>
    <h3></h3>
    <p>Clique em uma das cores abaixo para pintar a tela</p>

    <div id="paleta">
        <div id="pincel-azul" class="pincel" style="background-color: blue;"></div>
        <div id="pincel-vermelho" class="pincel" style="background-color: red;"></div>
        <div id="pincel-amarelo" class="pincel" style="background-color: gold;"></div>
        <div id="pincel-preto" class="pincel" style="background-color: black;"></div>
        <div id="pincel-marrom" class="pincel" style="background-color: brown;"></div>
        <div id="pincel-roxo" class="pincel" style="background-color: purple;"></div>
        <div id="pincel-laranja" class="pincel" style="background-color: orange;"></div>
        <div id="pincel-rosa" class="pincel" style="background-color: pink;"></div>
        <div id="pincel-verde" class="pincel" style="background-color: green;"></div>
    </div>

<script src="script.js"></script>
</body>
</html>
